<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🍌 BOMBANANA 组队大厅</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/overrides.css" />
  </head>
  <body>
    <div class="bg-orbit orbit-a"></div><div class="bg-orbit orbit-b"></div>
    <header class="nav"><div class="wrap nav-inner">
      <div class="brand"><span class="brand-mark">💣</span><span><b>BOMBANANA</b><small>组队大厅</small></span></div>
      <div class="nav-promo"><span class="promo-brand"><img class="promo-logo" src="https://image.xunyou.com/2025/03/15/1742177486234.png" alt="迅游网游加速器" /><small>开黑专线 · 稳定连接</small></span><a href="https://www.xunyou.com" target="_blank" rel="noreferrer"><span>前往官网</span><i>↗</i></a></div>
    </div></header>
    <main>
      <section class="hero wrap"><div class="hero-copy"><p class="eyebrow">⚡ 找到队友 · 即刻开局</p><h1>拆弹搭子，<br /><em>现在</em><strong>就差你</strong></h1><p class="hero-sub">报上角色、在线时段和组队偏好<br />无需刷屏等人，合适的队友一眼就能找到。</p><div class="hero-actions"><button class="primary" id="heroPost">发布招募 <span>＋</span></button><span class="hero-note">🎙️ 三人协作，沟通更顺畅</span></div></div><div class="hero-art"><div class="burst">BOMB<br /><b>🍌</b></div><div class="monkey">🙈</div><div class="hero-stats"><div><b id="livePlayers">0</b><span>位玩家正在找队</span></div><div><b id="openSquads">0</b><span>条有效招募</span></div><div><b>迅游</b><span>游戏加速入口</span></div></div></div></section>
      <section class="toolbar wrap"><div class="filters"><button class="filter active" data-filter="all">🎯 全部队伍</button><button class="filter" data-filter="1=2">🙈 1 缺 2</button><button class="filter" data-filter="2=1">🙉 2 缺 1</button></div><label class="search">⌕<input id="search" placeholder="搜昵称 / Steam 码 / 招募说明..." /></label></section>
      <section class="wrap"><div class="section-head"><div><p class="eyebrow">OPEN SQUADS</p><h2>等待集合 <span id="count"></span></h2></div><span class="online-dot"><i></i> 本地实时更新</span></div><div id="grid" class="grid"></div><div id="empty" class="empty" hidden><span class="empty-icon">＋</span><b>还没有招募信息</b><p>发布第一条真实招募，队伍会保存在当前浏览器中。</p><button class="primary" id="emptyPost">发布招募</button></div></section>
    </main>
    <button class="float-post" id="floatPost">＋ 发布招募</button>
    <div class="modal-backdrop" id="modal" hidden><div class="modal"><div class="modal-head"><div><p class="eyebrow">QUICK RECRUIT</p><h3 id="modalTitle">发布招募</h3></div><button class="icon-btn" id="closeModal" aria-label="关闭">×</button></div><form id="postForm"><div class="form-grid"><label>昵称<input id="nickname" placeholder="留空将显示「神秘玩家」" /></label><label>Steam 码<input id="steam" required inputmode="numeric" placeholder="例如：123456789" /></label></div><fieldset><legend>当前人数</legend><div class="choice-row"><label><input type="radio" name="teamType" value="1=2" checked /> 1 人 · 缺 2</label><label><input type="radio" name="teamType" value="2=1" /> 2 人 · 缺 1</label></div></fieldset><fieldset><legend>你的性别</legend><div class="choice-row compact"><label><input type="radio" name="gender" value="女生" checked /> 🎀 女生</label><label><input type="radio" name="gender" value="男生" /> 🧢 男生</label><label><input type="radio" name="gender" value="保密" /> 🕶️ 保密</label></div></fieldset><fieldset class="role-picker"><legend>需要的队友角色 <small id="roleHint">最多选择 2 个，留空表示不限</small></legend><div class="role-options"><label><input type="checkbox" name="needRole" value="盲猴" /><span>🙈</span><b>盲猴</b></label><label><input type="checkbox" name="needRole" value="聋猴" /><span>🙉</span><b>聋猴</b></label><label><input type="checkbox" name="needRole" value="哑猴" /><span>🙊</span><b>哑猴</b></label></div></fieldset><label>招募说明<textarea id="message" rows="3" placeholder="简单说说打法、时间和组队偏好"></textarea></label><label>在线时段<input id="onlineTime" placeholder="例如：工作日 20-23 点" /></label><div class="form-actions"><button type="button" class="ghost" id="cancelModal">取消</button><button class="primary" type="submit">发布招募 <span>↗</span></button></div></form></div></div>
    <div class="toast" id="toast"></div>
    <div class="modal-backdrop" id="detailModal" hidden><div class="modal"><div class="modal-head"><div><p class="eyebrow">PLAYER PROFILE</p><h3 id="detailTitle">玩家信息</h3></div><button class="icon-btn" id="closeDetail" aria-label="关闭">×</button></div><div id="detailBody"></div></div></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
